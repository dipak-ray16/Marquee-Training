<!DOCTYPE html>
<html>
<head>
    <title>Simple YouTube Clone</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        /* Header */
        .header {
            background: white;
            padding: 15px;
            border-bottom: 1px solid #ddd;
        }

        .logo {
            color: red;
            font-size: 28px;
            font-weight: bold;
            display: inline-block;
        }

        .search {
            display: inline-block;
            margin-left: 40px;
        }

        .search input {
            width: 400px;
            padding: 8px;
        }

        /* Sidebar */
        .sidebar {
            width: 180px;
            background: white;
            float: left;
            height: 100vh;
            border-right: 1px solid #ddd;
        }

        .sidebar a {
            display: block;
            padding: 12px;
            text-decoration: none;
            color: black;
        }

        .sidebar a:hover {
            background: #eee;
        }

        /* Main Content */
        .content {
            margin-left: 190px;
            padding: 20px;
        }

        .video {
            width: 300px;
            background: white;
            display: inline-block;
            margin: 10px;
            border: 1px solid #ddd;
        }

        .thumbnail {
            width: 300px;
            height: 170px;
            background: #cccccc;
        }

        .video-info {
            padding: 10px;
        }

        .title {
            font-weight: bold;
        }

        .channel,
        .views {
            color: gray;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="header">
        <span class="logo">YouTube</span>

        <span class="search">
            <input type="text" placeholder="Search">
        </span>
    </div>

    <div class="sidebar">
        <a href="#">Home</a>
        <a href="#">Shorts</a>
        <a href="#">Subscriptions</a>
        <a href="#">Library</a>
    </div>

    <div class="content">

        <div class="video">
            <div class="thumbnail"></div>
            <div class="video-info">
                <div class="title">Video Title 1</div>
                <div class="channel">Channel Name</div>
                <div class="views">1M views</div>
            </div>
        </div>

        <div class="video">
            <div class="thumbnail"></div>
            <div class="video-info">
                <div class="title">Video Title 2</div>
                <div class="channel">Channel Name</div>
                <div class="views">500K views</div>
            </div>
        </div>

        <div class="video">
            <div class="thumbnail"></div>
            <div class="video-info">
                <div class="title">Video Title 3</div>
                <div class="channel">Channel Name</div>
                <div class="views">250K views</div>
            </div>
        </div>

    </div>

</body>
</html>
